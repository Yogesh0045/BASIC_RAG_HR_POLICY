name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: hr_assistant
  CONTAINER_NAME: hr_assistant
  APP_PORT: 8501

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          if aws ecr describe-repositories \
               --repository-names "$ECR_REPOSITORY" \
               --region "$AWS_REGION" >/dev/null 2>err.txt; then
            echo "ECR repository '$ECR_REPOSITORY' already exists in $AWS_REGION"
          elif grep -q RepositoryNotFoundException err.txt; then
            echo "Creating ECR repository '$ECR_REPOSITORY' in $AWS_REGION"
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION"
          else
            cat err.txt
            exit 1
          fi
          # Verify it now exists (fails loudly if not)
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' --output text

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and push image
        id : build
        env:
          REGISTRY:  ${{ steps.ecr.outputs.registry }}
        run:  |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          echo "Pushing to $IMAGE"
          docker build -f Dockerfile.yaml -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$GITHUB_SHA" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    #environment: production

    steps:
    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1
      env:
        IMAGE: ${{ needs.build-and-push.outputs.image }}
        AWS_REGION: ${{ env.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        ENV_FILE_CONTENT: ${{ secrets.APP_ENV_FILE }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        APP_PORT: ${{ env.APP_PORT }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: IMAGE,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,ENV_FILE_CONTENT,CONTAINER_NAME,APP_PORT
        script: |
          set -euo pipefail

          # Install Docker on the host if it is not already installed.
          # Fresh instance deployable with zero manual setup beyond SSH access.
          if ! command -v docker >/dev/null 2>&1; then
            echo "==> Installing Docker"
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo systemctl enable --now docker
          fi
          sudo systemctl enable --now docker

          # Install the AWS CLI on the box if it isn't there yet (needed to log into ECR)
          if ! command -v aws >/dev/null 2>&1; then
            echo "==> Installing AWS CLI v2 (official installer -apt's awscli package isn't reliable)"
            sudo apt-get update -y
            sudo apt-get install -y curl unzip
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
            unzip -q -o /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscliv2.zip /tmp/aws
          fi

          echo "==> Writing runtime .env"
          printf '%s' "$ENV_FILE_CONTENT" > "$HOME/.env"
          chmod 600 "$HOME/.env"

          echo "==> Logging in to ECR"
          REGISTRY=$(echo "$IMAGE" | cut -d'/' -f1)
          aws ecr get-login-password --region "$AWS_REGION" \
            | sudo docker login --username AWS --password-stdin "$REGISTRY"

          echo "==> Pulling new image: $IMAGE"
          sudo docker pull "$IMAGE"

          echo "==> Restarting container"
          sudo docker stop "$CONTAINER_NAME" 2>/dev/null || true
          sudo docker rm "$CONTAINER_NAME" 2>/dev/null || true
          sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${APP_PORT}:${APP_PORT}" \
            --env-file "$HOME/.env" \
            "$IMAGE"

          echo "==> Cleaning up old images"
          sudo docker image prune -f

          echo "==> Health check"
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${APP_PORT}/_stcore/health" >/dev/null 2>&1; then
              echo "Deployed OK: $IMAGE"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after 60s"
          exit 1

          